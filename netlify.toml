[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback — required for react-router-dom BrowserRouter, otherwise
# direct links / refreshes on routes like /product/:id 404 on Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Cache static assets aggressively; index.html stays revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"